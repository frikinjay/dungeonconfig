plugins {
    id 'com.gradleup.shadow' version "9.2.2"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"


    common(project(path: ":common")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge"))  { transitive false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

jar {
    archiveClassifier = "raw" // Mark the default jar as raw
}

shadowJar {
    dependsOn(jar)

    // Remove default source set inclusion to prevent overwriting Loom-modified files (like fabric.mod.json)
    mainSpec.sourcePaths.clear()

    // Unpack jar output to preserve Loom's Jar-in-Jar metadata
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowBundle]

    // shadowJar becomes the main unclassified artifact
    archiveClassifier = null
}

// Ensure the standard jar task is replaced by the shadowJar
tasks.build.dependsOn shadowJar
