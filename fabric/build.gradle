plugins {
    id 'com.gradleup.shadow' version "9.2.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases" }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}", {
        exclude module: "fabric-api"
    }

    common(project(path: ":common")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

jar {
    archiveClassifier = "raw" // Mark the default jar as raw
}

shadowJar {
    dependsOn(jar)

    // Remove default source set inclusion to prevent overwriting Loom-modified files (like fabric.mod.json)
    mainSpec.sourcePaths.clear()

    // Unpack jar output to preserve Loom's Jar-in-Jar metadata
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowBundle]

    // shadowJar becomes the main unclassified artifact
    archiveClassifier = null
}

// Ensure the standard jar task is replaced by the shadowJar
tasks.build.dependsOn shadowJar